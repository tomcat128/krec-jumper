<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14102a">
<title>KREC Jumper</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #14102a; color: #fff;
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #14102a;
  }
  #screen { position: relative; line-height: 0; border: 4px solid #2b1740; box-shadow: 0 0 0 4px #0b0818, 0 14px 50px rgba(0, 0, 0, .6); }
  canvas {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* dezente Bildröhren-Zeilen, nur bei ganzzahliger Vergrößerung */
  #screen.scan::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(var(--px) - 1px),
      rgba(0, 0, 0, .09) calc(var(--px) - 1px), rgba(0, 0, 0, .09) var(--px));
  }

  /* ── Touch-Steuerung ── */
  #touch { display: none; }
  body.touch #touch { display: block; }
  .pad {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; gap: 14px; padding: 18px 10px 6px;      /* etwas Rand, damit der Daumen nicht danebentippt */
    touch-action: none;
  }
  .pad.left { left: max(8px, env(safe-area-inset-left)); }
  .pad.right { right: max(8px, env(safe-area-inset-right)); align-items: flex-end; }
  .pad button, .mini {
    border: 3px solid #fffaf0; color: #fffaf0;
    background: rgba(43, 23, 64, .55);
    box-shadow: 0 4px 0 rgba(11, 8, 24, .7);
    font: 700 24px/1 "Courier New", ui-monospace, monospace;
    touch-action: none; padding: 0;
  }
  .pad button { width: 78px; height: 78px; border-radius: 12px; }
  .pad.right button { border-radius: 50%; }
  .pad.right button[data-k="jump"] { margin-bottom: 30px; }  /* versetzt wie bei einem Gamepad */
  .pad button.on { background: #ff3f86; transform: translateY(3px); box-shadow: 0 1px 0 rgba(11, 8, 24, .7); }
  .pad button small { display: block; font-size: 10px; letter-spacing: .06em; margin-top: 4px; }
  .mini {
    position: fixed; top: max(8px, env(safe-area-inset-top));
    width: 42px; height: 42px; border-radius: 8px; border-width: 2px; font-size: 14px; opacity: .8;
  }
  #pauseBtn { right: max(8px, env(safe-area-inset-right)); }
  #fsBtn { right: calc(max(8px, env(safe-area-inset-right)) + 50px); }
  #muteBtn { right: calc(max(8px, env(safe-area-inset-right)) + 100px); font-size: 18px; }

  /* Hochformat: Bild oben, Knöpfe darunter – wie bei einem Handheld */
  @media (orientation: portrait) {
    body.touch #stage { align-items: flex-start; padding-top: max(58px, env(safe-area-inset-top)); }
    body.touch .pad { bottom: max(9vh, env(safe-area-inset-bottom)); }
    body.touch .pad { gap: 2.5vw; padding: 18px 4px 6px; }
    body.touch .pad button { width: 19vw; height: 19vw; max-width: 104px; max-height: 104px; background: #2b1740; }
    body.touch .pad button small { font-size: 8px; letter-spacing: 0; }
    body.touch .pad button.on { background: #ff3f86; }
  }
  /* Querformat: Knöpfe liegen halb durchsichtig über den Bildecken */
  @media (orientation: landscape) {
    body.touch .pad button { width: min(78px, 17vh); height: min(78px, 17vh); }
    body.touch .pad button small { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="screen"><canvas id="game" width="480" height="270"></canvas></div>
</div>
<div id="touch">
  <div class="pad left">
    <button data-k="left" aria-label="Links">◀</button>
    <button data-k="right" aria-label="Rechts">▶</button>
  </div>
  <div class="pad right">
    <button data-k="spin" aria-label="Sitzpirouette">B<small>PIROUETTE</small></button>
    <button data-k="jump" aria-label="Sprung">A<small>SPRUNG</small></button>
  </div>
  <button id="muteBtn" class="mini" aria-label="Ton und Musik an/aus">♪</button>
  <button id="fsBtn" class="mini" aria-label="Vollbild">[ ]</button>
  <button id="pauseBtn" class="mini" aria-label="Pause">II</button>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
