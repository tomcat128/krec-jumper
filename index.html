<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14102a">
<title>KREC Jumper</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #14102a; color: #fff;
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #14102a;
  }
  #screen { position: relative; line-height: 0; border: 4px solid #2b1740; box-shadow: 0 0 0 4px #0b0818, 0 14px 50px rgba(0, 0, 0, .6); }
  canvas {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* dezente Bildröhren-Zeilen, nur bei ganzzahliger Vergrößerung */
  #screen.scan::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      transparent 0, transparent calc(var(--px) - 1px),
      rgba(0, 0, 0, .09) calc(var(--px) - 1px), rgba(0, 0, 0, .09) var(--px));
  }

  /* ── Touch-Steuerung ── */
  #touch { display: none; }
  body.touch #touch { display: block; }
  .pad {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; gap: 14px; padding: 18px 10px 6px;      /* etwas Rand, damit der Daumen nicht danebentippt */
    touch-action: none;
  }
  .pad.left { left: max(8px, env(safe-area-inset-left)); }
  .pad.right { right: max(8px, env(safe-area-inset-right)); align-items: flex-end; }
  .pad button, .mini {
    border: 3px solid #fffaf0; color: #fffaf0;
    background: rgba(43, 23, 64, .55);
    box-shadow: 0 4px 0 rgba(11, 8, 24, .7);
    font: 700 24px/1 "Courier New", ui-monospace, monospace;
    touch-action: none; padding: 0;
  }
  .pad button { width: 78px; height: 78px; border-radius: 12px; }
  .pad.right button { border-radius: 50%; }
  .pad.right button[data-k="jump"] { margin-bottom: 30px; }  /* versetzt wie bei einem Gamepad */
  .pad button.on { background: #ff3f86; transform: translateY(3px); box-shadow: 0 1px 0 rgba(11, 8, 24, .7); }
  .pad button small { display: block; font-size: 10px; letter-spacing: .06em; margin-top: 4px; }
  .mini {
    position: fixed; top: max(8px, env(safe-area-inset-top));
    width: 42px; height: 42px; border-radius: 8px; border-width: 2px; font-size: 14px; opacity: .8;
  }
  #pauseBtn { right: max(8px, env(safe-area-inset-right)); }
  #fsBtn { right: calc(max(8px, env(safe-area-inset-right)) + 50px); }
  #muteBtn { right: calc(max(8px, env(safe-area-inset-right)) + 100px); font-size: 18px; }
  #hsBtn { right: calc(max(8px, env(safe-area-inset-right)) + 150px); font-size: 12px; }

  /* ── Bestenliste und Namenseingabe ── */
  .hs {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: flex-start; justify-content: center;
    padding: max(12px, 6vh) 12px 12px; background: rgba(20, 16, 42, .84);
  }
  .hs[hidden], .hs [hidden] { display: none; }
  .hs-box {
    width: min(440px, 100%); max-height: 100%;
    display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: #fffaf0; color: #2b1740;
    border: 4px solid #2b1740; box-shadow: 0 0 0 4px #ffd23f, 0 0 0 8px #2b1740, 0 14px 50px rgba(0, 0, 0, .6);
    font: 700 15px/1.3 "Courier New", ui-monospace, monospace; text-transform: uppercase;
  }
  .hs h2 { margin: 0; font-size: 24px; letter-spacing: .08em; text-align: center; color: #ff3f86; text-shadow: 2px 2px 0 #2b1740; }
  .hs p { margin: 0; text-align: center; }
  .hs form { display: flex; flex-direction: column; gap: 8px; }
  .hs input {
    width: 100%; padding: 8px 10px; border: 3px solid #2b1740; border-radius: 0; background: #fff; color: #2b1740;
    font: inherit; font-size: 22px; letter-spacing: .08em; text-transform: uppercase;
    -webkit-user-select: text; user-select: text; touch-action: manipulation;
  }
  .hs input:focus { outline: 3px solid #ff3f86; outline-offset: 1px; }
  .hs-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hs button {
    flex: 1 1 auto; padding: 9px 12px; border: 3px solid #2b1740; background: #ffd23f; color: #2b1740;
    box-shadow: 0 4px 0 #2b1740; font: inherit; text-transform: uppercase; cursor: pointer; touch-action: manipulation;
  }
  .hs button.ghost { background: #fffaf0; }
  .hs button:active { transform: translateY(3px); box-shadow: 0 1px 0 #2b1740; }
  .hs button:focus-visible { outline: 3px solid #ff3f86; outline-offset: 2px; }
  #hsMsg:empty { display: none; }
  #hsList {
    flex: 1 1 auto; min-height: 64px; margin: 0; padding: 0; list-style: none;
    overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    border: 3px solid #2b1740; background: #fff; font-variant-numeric: tabular-nums;
  }
  #hsList li { display: grid; grid-template-columns: 3.4em 1fr auto; gap: 8px; padding: 4px 10px; }
  #hsList li:nth-child(even) { background: #f3ead8; }
  #hsList li.me { background: #ff3f86; color: #fff; }
  #hsList li.none { display: block; padding: 18px 10px; text-align: center; }
  #hsList span:first-child, #hsList span:last-child { text-align: right; }

  /* Hochformat: Bild oben, Knöpfe darunter – wie bei einem Handheld */
  @media (orientation: portrait) {
    body.touch #stage { align-items: flex-start; padding-top: max(58px, env(safe-area-inset-top)); }
    body.touch .pad { bottom: max(9vh, env(safe-area-inset-bottom)); }
    body.touch .pad { gap: 2.5vw; padding: 18px 4px 6px; }
    body.touch .pad button { width: 19vw; height: 19vw; max-width: 104px; max-height: 104px; background: #2b1740; }
    body.touch .pad button small { font-size: 8px; letter-spacing: 0; }
    body.touch .pad button.on { background: #ff3f86; }
  }
  /* Querformat: Knöpfe liegen halb durchsichtig über den Bildecken */
  @media (orientation: landscape) {
    body.touch .pad button { width: min(78px, 17vh); height: min(78px, 17vh); }
    body.touch .pad button small { display: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="screen"><canvas id="game" width="960" height="540"></canvas></div>
</div>
<div id="touch">
  <div class="pad left">
    <button data-k="left" aria-label="Links">◀</button>
    <button data-k="right" aria-label="Rechts">▶</button>
  </div>
  <div class="pad right">
    <button data-k="spin" aria-label="Sitzpirouette">B<small>PIROUETTE</small></button>
    <button data-k="jump" aria-label="Sprung">A<small>SPRUNG</small></button>
  </div>
  <button id="hsBtn" class="mini" aria-label="Bestenliste">TOP</button>
  <button id="muteBtn" class="mini" aria-label="Ton und Musik an/aus">♪</button>
  <button id="fsBtn" class="mini" aria-label="Vollbild">[ ]</button>
  <button id="pauseBtn" class="mini" aria-label="Pause">II</button>
</div>
<div id="hs" class="hs" hidden>
  <div class="hs-box" role="dialog" aria-modal="true" aria-labelledby="hsTitle">
    <h2 id="hsTitle">Bestenliste</h2>
    <form id="hsForm" hidden>
      <p id="hsScore"></p>
      <label for="hsName">Dein Name</label>
      <input id="hsName" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
      <div class="hs-row">
        <button type="submit">Eintragen</button>
        <button type="button" id="hsSkip" class="ghost">Nicht eintragen</button>
      </div>
    </form>
    <p id="hsMsg" aria-live="polite"></p>
    <ol id="hsList"></ol>
    <button type="button" id="hsClose">Schließen</button>
  </div>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
