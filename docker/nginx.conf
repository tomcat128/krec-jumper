server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Immer beim Server nachfragen, damit ein neu gebautes Image sofort sichtbar ist
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }
}
